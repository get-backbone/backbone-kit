---
name: 04 📦 Publish packages

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types: [ publish-packages ]

permissions:
  contents: read
  packages: write

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for commit range checks
          ref: main  # check out the branch, not detached HEAD
      # Same key as 03-release-bump (git signing). Here it signs Maven artifacts (.asc) for Central + GHP
      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: ./.github/actions/tools
      - run: |
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MVN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MVN_CENTRAL_PASSWORD }}</password>
              </server>
              <server>
                <id>github</id>
                <username>get-backbone</username>
                <password>${{ secrets.PAT_BACKBONE_DEPLOY }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - run: task build:deploy-central
      - run: task build:deploy-github
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: .github/scripts/publish-summary.sh
