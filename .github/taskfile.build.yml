---
version: '3'

# use mvnd if available, otherwise (in CI) fallback to ./mvnw
vars:
  MAVEN_CMD: '$(command -v mvnd >/dev/null 2>&1 && echo mvnd || echo "./mvnw")'
  ROOT_DIR: "{{.TASKFILE_DIR}}/.."

tasks:
  clean:
    desc: Clean all modules
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} clean'

  cache:
    desc: Delete the build cache and stop mvn daemon (if exists)
    aliases: [ nuke ]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - 'rm -rf ~/.m2/build-cache'
      - 'command -v mvnd >/dev/null 2>&1 && mvnd --stop || true'

  compile:
    desc: Compile all modules
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} compile'

  package:
    desc: Package all modules; skips all tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} package -Dmaven.test.skip'

  install:
    desc: Install all modules; skips all tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} install -Dmaven.test.skip'

  deploy:
    desc: Deploy to Maven Central then GitHub Packages; skips all tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: deploy-central
      - task: deploy-github

  deploy-central:
    desc: Deploy to Maven Central (Portal); skips all tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} deploy -Pcentral -Dmaven.test.skip'

  deploy-github:
    desc: Deploy to GitHub Packages; skips all tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} deploy -Pgithub -Dmaven.test.skip'

  test:
    desc: Test all modules
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} verify'

  unit-test:
    desc: Unit test all modules; skips integration tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} test'

  integration-test:
    desc: Integration test modules (skips unit tests)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - '{{.MAVEN_CMD}} verify -DskipUnitTests'

  static-analysis:
    dir: "{{.ROOT_DIR}}"
    desc: Static analysis profile; skips all tests
    cmds:
      - '{{.MAVEN_CMD}} -Pcode-quality verify -DautoUpdate=false'
      - '{{.MAVEN_CMD}} -Pdependency-check dependency-check:aggregate -DautoUpdate=false'

  owasp-dependency-check-update:
    dir: "{{.ROOT_DIR}}"
    desc: Refresh OWASP NVD data only (for CI cache warming; no project scan)
    cmds:
      - .github/scripts/owasp-update-resilient.sh
